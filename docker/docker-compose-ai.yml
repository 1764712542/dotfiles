# ==========================================
# docker-compose-ai.yml — AI 服务栈 Docker Compose
# 部署路径: ~/dotfiles/docker/docker-compose-ai.yml
# 所属包: docker/
# 功能: Qdrant 默认向量库 + 可选 LiteLLM
# 使用: colima start && docker compose -f docker-compose-ai.yml up -d
# ==========================================

services:
  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LiteLLM — OpenAI 兼容 API 代理（统一路由: Ollama 本机 + OpenRouter）
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    profiles: ["llm"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
